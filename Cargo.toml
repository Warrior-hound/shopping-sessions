[package]
name = "sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "=0.9.5"
memchr = "=2.7.4"
hashbrown = { version = "=0.15.2", default-features = false, features = ["inline-more"] }
foldhash = "=0.1.4"
parquet = { version = "=53.3.0", default-features = false }
bytes = "=1.9.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
